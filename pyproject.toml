[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mlservice"
version = "0.1.0"
description = "Blueprint for taking a tabular ML model from training to a validated production service."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "ML Service Blueprint" }]
keywords = ["machine-learning", "mlops", "fastapi", "model-registry", "template"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
]

dependencies = [
  "fastapi>=0.115,<1",
  # starlette arrives transitively via fastapi, but is floored explicitly here:
  # 0.48.x carries eight known advisories, including a FileResponse Range-header
  # ReDoS and Host-header URL-reconstruction flaws. Pinning the floor at the
  # first fully-patched release stops a resolver from quietly selecting an old
  # one. Re-check with `make audit` before relaxing it.
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.30,<0.36",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pyyaml>=6.0,<7",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.4,<2",
  "prometheus-client>=0.20,<1",
  "typer>=0.12,<0.20",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
loadtest = ["locust>=2.29,<3"]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<8",
  "httpx>=0.27,<1",
  "ruff>=0.6,<0.15",
  "mypy>=1.10,<2",
  "types-PyYAML>=6.0",
  "pandas-stubs>=2.2",
  "pip-audit>=2.7,<3",
  "build>=1.2,<2",
]

[project.scripts]
mlservice = "mlservice.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/ml-service-blueprint"

[tool.hatch.build.targets.wheel]
packages = ["src/mlservice"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ARG", "PTH", "RET", "TID", "N"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
# Pin the first-party package explicitly. Left to inference, ruff classifies
# `mlservice` differently depending on what is present in the working directory,
# so lint passes locally and fails on a clean checkout (or in CI). Naming it here
# makes import grouping deterministic everywhere.
known-first-party = ["mlservice"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]
# FastAPI exception handlers must accept (request, exc) whether or not they use them.
"src/mlservice/serving/errors.py" = ["ARG001"]
# Golden-path steps share one Callable[[Context], ...] signature; not all use ctx.
# StepSkipped is control flow, not an error, so the Error suffix would misname it.
"scripts/verify_golden_path.py" = ["ARG001", "ARG002", "N818"]

[tool.mypy]
# No `python_version` pin on purpose. Pinning it to 3.11 while running under a
# newer interpreter makes mypy read that interpreter's stubs at the older
# language level, and it rejects PEP 695 `type` statements in numpy's stubs.
# Unset, mypy checks against whichever interpreter runs it, which is what the
# CI matrix is for.
files = ["src/mlservice", "scripts"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "prometheus_client.*", "opentelemetry.*", "locust.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: trains a model or otherwise takes multiple seconds",
  "container: requires a working Docker daemon",
]
filterwarnings = ["error::DeprecationWarning:mlservice.*"]

[tool.coverage.run]
source = ["src/mlservice"]
branch = true
